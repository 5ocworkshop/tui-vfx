# <FILE>Cargo.toml</FILE> - <DESC>Workspace manifest for tui-vfx</DESC>
# <VERS>VERSION: 0.4.0</VERS>
# <WCTX>Sub-plan A Phase A.1 — landing the role-tagging / SemanticScene foundation primitives in tui-vfx-types; bump workspace version so downstream consumers can pin the first release that exposes them</WCTX>
# <CLOG>0.4.0: MINOR bump workspace.package.version 0.5.0 → 0.6.0 and every internal-crate version floor 0.5.0 → 0.6.0 for Sub-plan A Phase A.1 — additive foundation primitives in tui-vfx-types (SemanticScene, RoleMap, RoleTag, RoleInterner, RoleId, SceneMetadata, LayerId, RecipeId, InternedString, InternedRoleName). Additive: every 0.5.0 API keeps working; the new types are purely new surface.
# 0.3.0: bump workspace.package.version 0.4.0 → 0.5.0 for the Phase-0 outstanding shader bindings closeout.</CLOG>

[workspace]
resolver = "3"
members = [
    "crates/tui-vfx",
    "crates/tui-vfx-types",
    "crates/tui-vfx-core",
    "crates/tui-vfx-core-macros",
    "crates/tui-vfx-geometry",
    "crates/tui-vfx-compositor",
    "crates/tui-vfx-style",
    "crates/tui-vfx-content",
    "crates/tui-vfx-shadow",
    "crates/tui-vfx-debug",
    "crates/tui-vfx-probe",
    "xtask",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.86.0"
license = "MIT"
repository = "https://github.com/5ocworkshop/tui-vfx"
keywords = ["tui", "terminal", "effects", "animation"]
categories = ["command-line-interface", "graphics"]

[workspace.dependencies]
# Internal crates
tui-vfx-types = { path = "crates/tui-vfx-types", version = "0.6.0" }
tui-vfx-core = { path = "crates/tui-vfx-core", version = "0.6.0" }
tui-vfx-core-macros = { path = "crates/tui-vfx-core-macros", version = "0.6.0" }
tui-vfx-geometry = { path = "crates/tui-vfx-geometry", version = "0.6.0" }
tui-vfx-compositor = { path = "crates/tui-vfx-compositor", version = "0.6.0" }
tui-vfx-style = { path = "crates/tui-vfx-style", version = "0.6.0" }
tui-vfx-content = { path = "crates/tui-vfx-content", version = "0.6.0" }
tui-vfx-shadow = { path = "crates/tui-vfx-shadow", version = "0.6.0" }
tui-vfx-debug = { path = "crates/tui-vfx-debug", version = "0.6.0" }

# External dependencies (preserve versions from source crates)
mixed-signals = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
smallvec = "1.11"

# Sister projects (co-designed; see docs/internal/plans/splash-library-and-vfx-integration.md)
rocketsplash-rt = "0.2.2"

# <FILE>Cargo.toml</FILE> - <DESC>Workspace manifest for tui-vfx</DESC>
# <VERS>END OF VERSION: 0.1.0</VERS>
# Example/demo workloads need meaningful optimization in dev too; otherwise
# local cargo run / cargo test significantly under-represents real runtime
# performance and makes the stack look slower than it is.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
