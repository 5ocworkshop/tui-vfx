# <FILE>Cargo.toml</FILE> - <DESC>Workspace manifest for tui-vfx</DESC>
# <VERS>VERSION: 0.14.0</VERS>
# <WCTX>Compositor-next Phase 2 — add copied compositor-next crate as a workspace member/dependency.</WCTX>
# <CLOG>0.14.0: MINOR add tui-vfx-compositor-next workspace member/dependency for copy-first compositor-next baseline.</CLOG>

[workspace]
resolver = "3"
members = [
    "crates/tui-vfx",
    "crates/tui-vfx-types",
    "crates/tui-vfx-contract",
    "crates/tui-vfx-contract-cli",
    "crates/tui-vfx-player",
    "crates/tui-vfx-player-backend-compositor",
    "crates/tui-vfx-player-cli",
    "crates/tui-vfx-player-ui",
    "crates/tui-vfx-next",
    "crates/tui-vfx-core",
    "crates/tui-vfx-core-macros",
    "crates/tui-vfx-geometry",
    "crates/tui-vfx-compositor",
    "crates/tui-vfx-compositor-next",
    "crates/tui-vfx-style",
    "crates/tui-vfx-content",
    "crates/tui-vfx-shadow",
    "crates/tui-vfx-debug",
    "crates/tui-vfx-probe",
    "xtask",
]

[workspace.package]
version = "0.11.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
repository = "https://github.com/5ocworkshop/tui-vfx"
keywords = ["tui", "terminal", "effects", "animation"]
categories = ["command-line-interface", "graphics"]

[workspace.dependencies]
# Internal crates
tui-vfx-types = { path = "crates/tui-vfx-types", version = "0.11.0" }
tui-vfx-contract = { path = "crates/tui-vfx-contract", version = "0.11.0" }
tui-vfx-contract-cli = { path = "crates/tui-vfx-contract-cli", version = "0.11.0" }
tui-vfx-player = { path = "crates/tui-vfx-player", version = "0.11.0" }
tui-vfx-player-backend-compositor = { path = "crates/tui-vfx-player-backend-compositor", version = "0.11.0" }
tui-vfx-player-cli = { path = "crates/tui-vfx-player-cli", version = "0.11.0" }
tui-vfx-player-ui = { path = "crates/tui-vfx-player-ui", version = "0.11.0" }
tui-vfx-core = { path = "crates/tui-vfx-core", version = "0.11.0" }
tui-vfx-core-macros = { path = "crates/tui-vfx-core-macros", version = "0.11.0" }
tui-vfx-geometry = { path = "crates/tui-vfx-geometry", version = "0.11.0" }
tui-vfx-compositor = { path = "crates/tui-vfx-compositor", version = "0.11.0" }
tui-vfx-compositor-next = { path = "crates/tui-vfx-compositor-next", version = "0.11.0" }
tui-vfx-style = { path = "crates/tui-vfx-style", version = "0.11.0" }
tui-vfx-content = { path = "crates/tui-vfx-content", version = "0.11.0" }
tui-vfx-shadow = { path = "crates/tui-vfx-shadow", version = "0.11.0" }
tui-vfx-debug = { path = "crates/tui-vfx-debug", version = "0.11.0" }

# External dependencies (preserve versions from source crates)
mixed-signals = { path = "../mixed-signals", version = "0.3.0" }
# HCT (Hue, Chroma, Tone) perceptual color space — used by tui-vfx-style for
# brightness scaling and gradient interpolation that preserves perceived hue.
# gt-design already depends on mcu-terminal-color which sits on top of these
# crates; both are published to crates.io as part of the mcu-material-color
# Material Color Utilities Rust port.
mcu-hct = "0.2.0"
mcu-utils = "0.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2.1"
smallvec = "1.11"
ratatui = "0.30"
crossterm = "0.28"
fast-fs = { path = "../fast-libraries/crates/fast-fs", version = "0.2.1" }
tokio = { version = "1.48", features = ["rt", "time"] }

# Sister projects (co-designed; see docs/internal/plans/splash-library-and-vfx-integration.md)
rocketsplash-rt = "0.2.2"

# <FILE>Cargo.toml</FILE> - <DESC>Workspace manifest for tui-vfx</DESC>
# <VERS>END OF VERSION: 0.13.0</VERS>
# Example/demo workloads need meaningful optimization in dev too; otherwise
# local cargo run / cargo test significantly under-represents real runtime
# performance and makes the stack look slower than it is.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
