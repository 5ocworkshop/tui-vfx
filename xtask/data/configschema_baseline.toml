# <FILE>xtask/data/configschema_baseline.toml</FILE> - <DESC>Baseline allowlist of pre-existing hand-written impl ConfigSchema for X blocks</DESC>
# <VERS>VERSION: 1.0.0</VERS>
# <WCTX>Packet 1.9.A — ConfigSchema justification lint</WCTX>
# <CLOG>1.0.0: initial baseline from live-tree audit on 2026-04-26 (15 impls; packet estimated 12 — 5 additional generic impls found at scan time; drift documented in report)</CLOG>
#
# Entries here are exempt from the justification-comment requirement introduced
# by packet 1.9.A. The followup audit packet (1.9.A.followup) walks each entry
# and either:
#   (a) adds a CONFIGSCHEMA-JUSTIFICATION comment and removes the entry, or
#   (b) migrates the impl to #[derive(ConfigSchema)] and removes the entry.
#
# New impls MUST NOT be added here. New hand-written impls must carry a
# // CONFIGSCHEMA-JUSTIFICATION: <kind>: <reason>  line directly above the
# impl line, or a ///  doc-comment block above containing CONFIGSCHEMA-JUSTIFICATION:.
#
# Modification of this file requires explicit reviewer approval (it is the
# only path to silently allow an unjustified hand-written impl).

