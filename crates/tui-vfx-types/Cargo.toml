# <FILE>crates/tui-vfx-types/Cargo.toml</FILE> - <DESC>Foundation types for tui-vfx ecosystem</DESC>
# <VERS>VERSION: 0.5.0</VERS>
# <WCTX>Glyph rendering framework Phase 3: add mixed-signals dep for GlyphEncoder and subcell sampling helpers</WCTX>
# <CLOG>0.5.0: add mixed-signals.workspace = true so glyph module can consume Signal/SignalContext/SignalWithSlope.</CLOG>

[package]
name = "tui-vfx-types"
description = "Framework-agnostic foundation types for the tui-vfx ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["animation", "terminal", "tui", "types"]
categories = ["data-structures"]

[dependencies]
mixed-signals = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tui-vfx-core = { path = "../tui-vfx-core" }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["serde"]
serde = ["dep:serde"]

# <FILE>crates/tui-vfx-types/Cargo.toml</FILE> - <DESC>Foundation types for tui-vfx ecosystem</DESC>
# <VERS>END OF VERSION: 0.5.0</VERS>
