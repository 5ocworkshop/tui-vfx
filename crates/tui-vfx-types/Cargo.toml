# <FILE>crates/tui-vfx-types/Cargo.toml</FILE> - <DESC>Foundation types for tui-vfx ecosystem</DESC>
# <VERS>VERSION: 0.4.0</VERS>
# <WCTX>Sub-plan A Phase A.1 — SemanticScene / RoleMap / RoleTag / opaque newtype foundation primitives</WCTX>
# <CLOG>0.4.0: add serde_json dev-dependency for integration-test serde round-trip assertions introduced in Phase A.1.
# 0.3.1: Remove no-std category and add sub-crate README reference.</CLOG>

[package]
name = "tui-vfx-types"
description = "Framework-agnostic foundation types for the tui-vfx ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["animation", "terminal", "tui", "types"]
categories = ["data-structures"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["serde"]
serde = ["dep:serde"]

# <FILE>crates/tui-vfx-types/Cargo.toml</FILE> - <DESC>Foundation types for tui-vfx ecosystem</DESC>
# <VERS>END OF VERSION: 0.4.0</VERS>
