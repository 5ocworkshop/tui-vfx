# <FILE>crates/tui-vfx-types/Cargo.toml</FILE> - <DESC>Foundation types for tui-vfx ecosystem</DESC>
# <VERS>VERSION: 0.5.1</VERS>
# <WCTX>New kernel Phase D0: add optional Schemars support for clean-room contract schemas.</WCTX>
# <CLOG>0.5.1: PATCH — add optional schemars dependency/feature so v3.1 clean-room schemas can reference shared Cell/RoleTag/Rect foundation types.
# 0.5.0: add mixed-signals.workspace = true so glyph module can consume Signal/SignalContext/SignalWithSlope.</CLOG>

[package]
name = "tui-vfx-types"
description = "Framework-agnostic foundation types for the tui-vfx ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["animation", "terminal", "tui", "types"]
categories = ["data-structures"]

[dependencies]
mixed-signals = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }
schemars = { workspace = true, optional = true }
tui-vfx-core = { path = "../tui-vfx-core" }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["serde"]
serde = ["dep:serde"]
schemars = ["dep:schemars", "serde"]

# <FILE>crates/tui-vfx-types/Cargo.toml</FILE> - <DESC>Foundation types for tui-vfx ecosystem</DESC>
# <VERS>END OF VERSION: 0.5.1</VERS>
