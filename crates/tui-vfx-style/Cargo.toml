# <FILE>crates/tui-vfx-style/Cargo.toml</FILE> - <DESC>Manifest for Style/Color logic library</DESC>
# <VERS>VERSION: 0.1.3</VERS>
# <WCTX>TTE effects port — add mcu-hct + mcu-utils for HCT-aware color operations (brightness scaling, gradient interpolation in perceptually-uniform space).</WCTX>
# <CLOG>0.1.3: pull in mcu-hct + mcu-utils so ColorSpace::Hct and brighten_hct can route through Material Color's perceptual tone space.</CLOG>

[package]
name = "tui-vfx-style"
description = "Color interpolation and style effects for tui-vfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Foundation types (framework-agnostic)
tui-vfx-types.workspace = true
serde.workspace = true
serde_json.workspace = true
# Introspection protocol
tui-vfx-core.workspace = true
# Signal generators for wave-based shaders
mixed-signals.workspace = true
# Geometry primitives (for shared EasingType)
tui-vfx-geometry.workspace = true
# HCT perceptual color space (Material Color Utilities port). Used by
# ColorSpace::Hct and the brighten_hct helper. Pulls a small, focused
# color-science dep tree; sister project gt-design already depends on
# mcu-terminal-color (built on these crates).
mcu-hct.workspace = true
mcu-utils.workspace = true

[dev-dependencies]
# Standard testing
rstest = "0.18"

# <FILE>crates/tui-vfx-style/Cargo.toml</FILE> - <DESC>Manifest for Style/Color logic library</DESC>
# <VERS>END OF VERSION: 0.1.3</VERS>
