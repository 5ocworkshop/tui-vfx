# <FILE>crates/tui-vfx-content/Cargo.toml</FILE> - <DESC>Library manifest</DESC>
# <VERS>VERSION: 0.1.3</VERS>
# <WCTX>feat/cursor-primitive T27: pull tui-vfx-types into tui-vfx-content deps so the new fnc_apply_ghost_glyphs_to_grid helper can talk to Grid + Cell directly</WCTX>
# <CLOG>Add tui-vfx-types as a workspace dep</CLOG>

[package]
name = "tui-vfx-content"
description = "Text manipulation primitives for tui-vfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
unicode-segmentation = "1.10"
serde.workspace = true
# Introspection protocol
tui-vfx-core.workspace = true
mixed-signals.workspace = true
tui-vfx-style.workspace = true
# Grid/Cell primitives for cursor-ghost glyph overwrite helper
tui-vfx-types.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = []

