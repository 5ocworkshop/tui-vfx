# <FILE>crates/tui-vfx-content/Cargo.toml</FILE> - <DESC>Library manifest</DESC>
# <VERS>VERSION: 0.3.0</VERS>
# <WCTX>Splash library + VFX integration plan Stage 1: pull rocketsplash-rt in as a default dep so the new RocketsplashImage source primitive can blit .rss cells into any tui-vfx Grid.</WCTX>
# <CLOG>0.3.0: add tui-vfx-geometry workspace dep for cell-motion scheduler.
# 0.2.0: add rocketsplash-rt workspace dep for the RocketsplashImage source primitive.</CLOG>

[package]
name = "tui-vfx-content"
description = "Text manipulation primitives for tui-vfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
unicode-segmentation = "1.10"
serde.workspace = true
# Introspection protocol
tui-vfx-core.workspace = true
mixed-signals.workspace = true
tui-vfx-style.workspace = true
# Grid/Cell primitives for cursor-ghost glyph overwrite helper + RocketsplashImage source
tui-vfx-types.workspace = true
# Workspace geometry primitives for pure content-local cell motion
tui-vfx-geometry.workspace = true
# Sister project — image source primitive bridges .rss cells into tui-vfx grids
rocketsplash-rt.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = []

# <FILE>crates/tui-vfx-content/Cargo.toml</FILE> - <DESC>Library manifest</DESC>
# <VERS>END OF VERSION: 0.3.0</VERS>
