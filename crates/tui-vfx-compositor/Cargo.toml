# <FILE>crates/tui-vfx-compositor/Cargo.toml</FILE> - <DESC>Manifest for tui-vfx-compositor library</DESC>
# <VERS>VERSION: 0.4.4</VERS>
# <WCTX>Audit recommendation 1.2 + 1.3 — depend on tui-vfx-geometry so the WipeDirection enum and shared wipe_progress / wipe_visible_at helpers can be re-used by both the Wipe mask and the RevealWipe shader from one source of truth.</WCTX>
# <CLOG>0.4.4: add tui-vfx-geometry as a runtime dependency (was already used at the workspace level by tui-vfx-style; explicit here for the WipeDirection re-export and the shared wipe geometry helpers).
# 0.4.3: feat/cursor-primitive T32 (added tui-vfx-content as a dev-dep)</CLOG>

[package]
name = "tui-vfx-compositor"
description = "Framework-agnostic cell compositor for tui-vfx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# L0 foundation types (Color, Style, Cell, Rect, Modifiers, Grid)
tui-vfx-types.workspace = true
# Small vector for inline allocation (no heap for ≤N effects)
smallvec.workspace = true
# Serialization
serde.workspace = true
serde_json = "1.0"
# Introspection protocol
tui-vfx-core.workspace = true
# Style primitives for shaders
tui-vfx-style.workspace = true
# Geometry primitives (WipeDirection enum + shared wipe geometry helpers)
tui-vfx-geometry.workspace = true
# Shadow rendering
tui-vfx-shadow.workspace = true
# Signal generators for wave-based samplers
mixed-signals.workspace = true
# Debug logging
tui-vfx-debug.workspace = true
lazy_static = "1.4"

[dev-dependencies]
# Content primitives — used only by end-to-end integration tests that drive
# the Typewriter + Cursor primitive through the full pipeline.
tui-vfx-content.workspace = true
# Signal context (for Typewriter::transform_with_cursor) — already a workspace
# dep of tui-vfx-content, but we construct SignalContext directly in the test.
mixed-signals.workspace = true

# <FILE>crates/tui-vfx-compositor/Cargo.toml - <DESC>Manifest for tui-vfx-compositor library</DESC>
# <VERS>END OF VERSION: 0.4.3</VERS>
