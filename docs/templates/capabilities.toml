# Generated stubs - fill in use_cases, energy, and ai_hint
# ════════════════════════════════════════════════════════════════════════════════

[effects.filters.FadeToCanvas]
summary = "Canvas-aware exit fade: blend cells toward a declared canvas color"
use_cases = ["exit_transitions", "dismissal", "modal_close"]
energy = "calm"
complexity = "simple"
premium = false
ai_hint = "Use as the exit filter on notifications, modals, and toolkit widgets that should fade into the terminal backdrop instead of flashing dark. Set canvas_color to the app's actual terminal background (e.g. {r:240,g:240,b:245} for a light theme, {r:20,g:20,b:30} for a dark one) and drive strength from the exit animation progress (0.0 = widget visible, 1.0 = fully faded into canvas). Replaces the older tint(black, 0.7+) hack which darkens regardless of canvas. Parameters: canvas_color (ColorConfig target), canvas_color_binding (optional runtime-param key that overrides canvas_color from a ShaderRuntimeParamValue::Rgb entry — use this to track live theme mode flips or app-reported terminal background changes), strength (BindableValue blend ratio), apply_to (foreground/background/both)."
